[package]
name = "coord2svg"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Official elevation and bathymetry to unioned, grouped colored SVG terrain"
license = "MIT"


[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
geographiclib-rs = "0.2.7"
i_overlay = { version = "9", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
proptest = "1"
resvg = { version = "0.45", default-features = false }
roxmltree = "0.21"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
lto = "thin"
