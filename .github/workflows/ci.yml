name: Tests and portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  GDAL_VERSION: ''

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: stable
            quality: true
          - os: macos-latest
            toolchain: stable
            quality: false
          - os: windows-latest
            toolchain: stable
            quality: false
          - os: ubuntu-24.04
            toolchain: '1.88.0'
            quality: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Install Linux GDAL
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgdal-dev pkg-config
          echo "GDAL_VERSION=$(pkg-config --modversion gdal)" >> "$GITHUB_ENV"

      - name: Install macOS GDAL
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install gdal pkg-config
          echo "GDAL_VERSION=$(pkg-config --modversion gdal)" >> "$GITHUB_ENV"

      - name: Set up Windows Conda
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: coord2svg
          python-version: '3.12'
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install Windows GDAL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          conda install --yes --name coord2svg --channel conda-forge libgdal-core
          if ($LASTEXITCODE -ne 0) { throw 'GDAL installation failed' }
          $gisInclude = Join-Path $env:CONDA_PREFIX 'Library/include'
          if (!(Test-Path (Join-Path $gisInclude 'gdal.h'))) { $gisInclude = Join-Path $gisInclude 'gdal' }
          if (!(Test-Path (Join-Path $gisInclude 'gdal.h'))) { throw 'GDAL headers are missing' }
          $gisLib = Join-Path $env:CONDA_PREFIX 'Library/lib'
          if (!(Test-Path (Join-Path $gisLib 'gdal.lib'))) { throw 'GDAL import library is missing' }
          $gisPackage = @(conda list --name coord2svg '^libgdal-core$' --json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $gisPackage.Count -ne 1) { throw 'Cannot determine GDAL version' }
          "GDAL_VERSION=$($gisPackage[0].version)" | Out-File -Append -FilePath $env:GITHUB_ENV
          "GDAL_INCLUDE_DIR=$gisInclude" | Out-File -Append -FilePath $env:GITHUB_ENV
          "GDAL_LIB_DIR=$gisLib" | Out-File -Append -FilePath $env:GITHUB_ENV
          "$env:CONDA_PREFIX/Library/bin" | Out-File -Append -FilePath $env:GITHUB_PATH
          "PROJ_DATA=$env:CONDA_PREFIX/Library/share/proj" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Cache Rust dependencies and builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.toolchain }}-gdal-${{ env.GDAL_VERSION }}

      - name: Check formatting
        if: matrix.quality
        run: cargo fmt --check

      - name: Clippy (warnings fail CI)
        if: matrix.quality
        run: cargo clippy --all-targets --locked -- -D warnings

      # Local GeoTIFFs, loopback HTTP, analytic terrain and pure Rust rendering.
      # No official provider downloads are needed for any test.
      - name: Run complete test suite
        run: cargo test --locked

      - name: Build release executable
        if: matrix.toolchain == 'stable'
        run: cargo build --release --locked

      - name: Smoke test release CLI and style options
        if: matrix.toolchain == 'stable'
        run: >-
          cargo run --release --locked --
          --lat 21.058334 --lon -157.374151 --radius 1000km
          --demo --grid-size 33 --levels 16 --offline
          --min-elevation 0m --max-elevation 10000ft
          --lowest-fill '#888888' --highest-fill '#000000' --no-stroke
          --every-n-fill '0ft,5,#4a6c80' --specific-fill '1mi,#ff8800'
          --out smoke.svg --save-grid smoke.tif

      - name: Upload smoke outputs and unbundled executable
        if: matrix.toolchain == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: coord2svg-${{ matrix.os }}
          path: |
            target/release/coord2svg
            target/release/coord2svg.exe
            smoke.svg
            smoke.json
            smoke.tif
          if-no-files-found: error
          retention-days: 14

      - name: Preserve property-test regression cases on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions-${{ matrix.os }}-${{ matrix.toolchain }}
          path: |
            **/*.proptest-regressions
            proptest-regressions/
          if-no-files-found: ignore
          retention-days: 14
